# Static SPA. The platform ingress routes /api to the backend before it ever
# reaches this server, so there is deliberately NO /api proxy block here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # long-cache the hashed asset bundle + generated art
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
