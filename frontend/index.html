<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>MUGEN Fighting</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; background: #08080c; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
      #stage { position: relative; image-rendering: pixeledge; image-rendering: pixelated; }
      canvas { display: block; image-rendering: pixelated; background: #000; }
      #hint { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; color: #6a6a7a; font-size: 11px; pointer-events: none; text-shadow: 0 1px 0 #000; }
      #boot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #cfcfe0; font-size: 14px; letter-spacing: 2px; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game" width="480" height="270"></canvas>
      <div id="boot">LOADING…</div>
      <div id="hint"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
